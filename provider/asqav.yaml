identity:
  author: asqav
  name: asqav
  label:
    en_US: Asqav
  description:
    en_US: Use your Asqav API key to sign selected actions, check signatures, and request multi-party approval.
  icon: icon.svg
  tags:
    - utilities
credentials_for_provider:
  asqav_api_key:
    type: secret-input
    required: true
    label:
      en_US: Asqav API key
    placeholder:
      en_US: Enter your Asqav API key (sk_...)
    help:
      en_US: Verify your email, then open Settings > API. Keep agents read and write access. Copy the full key once.
    url: https://www.asqav.com/dashboard/#/settings/api
  asqav_agent_id:
    type: text-input
    required: true
    label:
      en_US: Agent ID
    placeholder:
      en_US: Your Asqav agent ID (agt_...)
    help:
      en_US: Create an agent with the Asqav SDK or API in the same organization as the key, then copy its agt_ ID.
    url: https://www.asqav.com/docs/agents
tools:
  - tools/sign_action.yaml
  - tools/verify_signature.yaml
  - tools/request_action.yaml
extra:
  python:
    source: provider/asqav.py

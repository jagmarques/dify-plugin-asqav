identity:
  author: asqav
  name: asqav
  label:
    en_US: Asqav
  description:
    en_US: Sign selected actions, query hosted signature verification, and request approval sessions through Asqav.
  icon: icon.svg
  tags:
    - utilities
credentials_for_provider:
  asqav_api_key:
    type: secret-input
    required: true
    label:
      en_US: Asqav API key
    placeholder:
      en_US: Enter your Asqav API key (sk_...)
    help:
      en_US: Get your API key at asqav.com
    url: https://asqav.com
  asqav_agent_id:
    type: text-input
    required: true
    label:
      en_US: Agent ID
    placeholder:
      en_US: Your Asqav agent ID (agt_...)
    help:
      en_US: The agent ID to use for signing actions
tools:
  - tools/sign_action.yaml
  - tools/verify_signature.yaml
  - tools/request_action.yaml
extra:
  python:
    source: provider/asqav.py

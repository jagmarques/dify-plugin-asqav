identity:
  author: asqav
  name: asqav
  label:
    en_US: asqav
  description:
    en_US: AI agent governance, audit trails, and compliance. Sign agent actions with ML-DSA-65 via asqav.com.
  icon: icon.svg
  tags:
    - utilities
credentials_for_provider:
  asqav_api_key:
    type: secret-input
    required: true
    label:
      en_US: asqav API Key
    placeholder:
      en_US: Enter your asqav API key (sk_...)
    help:
      en_US: Get your API key at asqav.com
    url: https://asqav.com
  asqav_agent_id:
    type: text-input
    required: true
    label:
      en_US: Agent ID
    placeholder:
      en_US: Your asqav agent ID (agent_...)
    help:
      en_US: The agent ID to use for signing actions
tools:
  - tools/sign_action.yaml
  - tools/verify_signature.yaml
  - tools/request_action.yaml
extra:
  python:
    source: provider/asqav.py

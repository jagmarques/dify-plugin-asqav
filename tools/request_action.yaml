identity:
  name: request_action
  author: asqav
  label:
    en_US: Request Action
description:
  human:
    en_US: Create a pending approval session for an agent with an active signing group. Returns immediately; the workflow must check approval separately before executing.
  llm: Request a multi-party authorized action for an agent. Creates a signing session that requires multiple entity approvals. Returns the session ID, status, required approvals count, and current signatures collected. Returns immediately without waiting, polling, or an authorized output. Check the session through the Asqav API and require approved status before executing. The agent needs an active signing group and an account with approval quorum access.
parameters:
  - name: action_type
    type: string
    required: true
    label:
      en_US: Action Type
    human_description:
      en_US: Type of action requiring authorization, e.g. "deploy:production"
    llm_description: The action type that needs multi-party authorization. Examples - "deploy:production", "delete:resource", "transfer:funds".
    form: llm
  - name: params
    type: string
    required: false
    label:
      en_US: Parameters (JSON)
    human_description:
      en_US: Optional JSON object encoded as a string, sent in full to Asqav. Plain text is wrapped in a raw field
    llm_description: Optional JSON object encoded as a string, sent in full to Asqav. Plain text is wrapped in a raw field. Example - {"target":"us-east-1","version":"2.0"}
    form: llm
extra:
  python:
    source: tools/request_action.py
output_schema:
  type: object
  properties:
    session_id:
      type: string
      description: ID of the multi-party signing session.
    status:
      type: string
      description: Current session status, e.g. pending, approved, or expired.
    approvals_required:
      type: number
      description: Number of entity approvals required before authorization.
    signatures_collected:
      type: number
      description: Number of approvals collected so far.
    action_type:
      type: string
      description: The action type requiring authorization.
    created_at:
      type: string
      description: ISO 8601 timestamp when the session was created.
    expires_at:
      type: string
      description: ISO 8601 timestamp when the session expires.

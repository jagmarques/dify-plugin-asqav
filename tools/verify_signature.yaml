identity:
  name: verify_signature
  author: asqav
  label:
    en_US: Verify Signature
description:
  human:
    en_US: Verify an Asqav signature by its ID. This is a public check that needs no API key. Returns whether the signature is valid, the signing agent, and the action details.
  llm: Verify an Asqav signature by its signature ID. Returns verification status, the signing agent name/ID, the action type, and the timestamp. No authentication needed.
parameters:
  - name: signature_id
    type: string
    required: true
    label:
      en_US: Signature ID
    human_description:
      en_US: The signature ID to verify (e.g. sig_abc123)
    llm_description: The Asqav signature ID to verify. Usually starts with "sig_".
    form: llm
extra:
  python:
    source: tools/verify_signature.py
output_schema:
  type: object
  properties:
    verified:
      type: boolean
      description: True if the signature is valid.
    signature_id:
      type: string
      description: The verified signature ID.
    agent_id:
      type: string
      description: ID of the agent that produced the signature.
    agent_name:
      type: string
      description: Display name of the signing agent.
    action_type:
      type: string
      description: The action type that was signed.
    algorithm:
      type: string
      description: Signature algorithm, e.g. ML-DSA-65.
    signed_at:
      type: string
      description: ISO 8601 timestamp of when the action was signed.
    verification_url:
      type: string
      description: Public URL to verify the signature.

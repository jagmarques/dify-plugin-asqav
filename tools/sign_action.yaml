identity:
  name: sign_action
  author: asqav
  label:
    en_US: Sign Action
description:
  human:
    en_US: Sign an agent action with ML-DSA-65. Creates a tamper-evident audit record via asqav.com for AI agent governance and compliance. Returns authorized=true with the signature ID and verification URL when the action is permitted, or authorized=false with a reason when a policy, an emergency halt, or a delegation limit blocks it.
  llm: Sign an agent action with ML-DSA-65 for AI agent governance and compliance. Provide an action_type string (e.g. "read:data", "api:call", "tool:execute") and optional context as a JSON string. Returns a JSON object with an "authorized" boolean. When true, it includes signature_id, action_id, timestamp, verification_url, and signature_b64. When false, it includes a "reason" (policy_blocked, emergency_halt, delegation_denied, quarantine, or denied) and a human-readable "detail" so the workflow can branch instead of failing.
parameters:
  - name: action_type
    type: string
    required: true
    label:
      en_US: Action Type
    human_description:
      en_US: Type of action being signed, e.g. "read:data", "api:call", "tool:execute"
    llm_description: The action type string that identifies the kind of action being signed. Examples - "read:data", "api:call", "tool:execute", "deploy:production".
    form: llm
  - name: context
    type: string
    required: false
    label:
      en_US: Context (JSON)
    human_description:
      en_US: Optional JSON string with additional context for the action
    llm_description: Optional JSON string with metadata about the action. Example - {"file":"config.json","user":"admin"}
    form: llm
extra:
  python:
    source: tools/sign_action.py

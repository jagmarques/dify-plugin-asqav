name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: [self-hosted, hz-ci-light]
    strategy:
      fail-fast: false
      matrix:
        # Matches the Python version declared in manifest.yaml's runner block.
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run smoke tests
        timeout-minutes: 5
        run: |
          context=$(python scripts/check_quality.py --fingerprint)
          python - "$context" <<'PYTEST_BOOTSTRAP'
          import faulthandler
          import sys

          faulthandler.enable()
          faulthandler.dump_traceback_later(120, repeat=True)
          from gevent import monkey
          monkey.patch_all(sys=True)

          from coverage.cmdline import main
          raise SystemExit(main([
              "run", "--concurrency=gevent", "--context=" + sys.argv[1],
              "--source=tools,provider,scripts", "-m", "pytest", "-v",
              "-o", "faulthandler_timeout=120",
          ]))
          PYTEST_BOOTSTRAP

      - name: Package and check distribution
        run: |
          curl -fsSL https://github.com/langgenius/dify-plugin-daemon/releases/download/0.6.10/dify-plugin-linux-arm64 -o "$RUNNER_TEMP/dify"
          echo "dfaf4faed2fc5ff3703c8568b7ebc78bca55b90ea8735580edcd068b603a57e1  $RUNNER_TEMP/dify" | sha256sum --check
          chmod +x "$RUNNER_TEMP/dify"
          "$RUNNER_TEMP/dify" plugin package . -o "$RUNNER_TEMP/asqav.difypkg"
          context=$(python scripts/check_quality.py --fingerprint)
          python -m coverage run --concurrency=gevent --append --context="$context" --source=tools,provider,scripts scripts/check_package.py "$RUNNER_TEMP/asqav.difypkg"
          python -m coverage json --show-contexts
          python scripts/check_quality.py coverage.json
